<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="pv.css">
<style>
  .shot { width: 640px; }
  #rec-timer { left: 448px; top: 102px; width: 182px; height: 56px; border-radius: 12px; backdrop-filter: blur(18px); background: rgba(120, 110, 100, .55);
    color: #fff; font-family: Zen, sans-serif; font-size: 30px; font-weight: 600; letter-spacing: .04em; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #rec-timer i { width: 12px; height: 12px; border-radius: 50%; background: #FF3B30; }
  .photo-big { position: absolute; left: 110px; top: 560px; width: 700px; padding: 22px 22px 26px; }
  .photo-big .ph { aspect-ratio: 941 / 1672; height: auto; }
  .photo-big .mos { position: absolute; left: 22px; top: 22px; right: 22px; bottom: 26px; background-size: cover; background-position: center; opacity: 0; }
  .mini { width: 280px; }
  .hash { position: absolute; font-family: Zen, sans-serif; font-size: 34px; color: var(--deep); background: #fff; border-radius: 999px; padding: 14px 30px; box-shadow: 0 14px 30px rgba(46,58,70,.14); }
  .cut { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; }
  .cut-label { position: absolute; left: 70px; bottom: 150px; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  .cut-label .d { font-family: CormI, serif; font-size: 64px; }
  .cut-label .m { font-family: Zen, sans-serif; font-size: 34px; opacity: .9; margin-top: 6px; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: rgba(46,58,70,.55); display: flex; align-items: center; padding: 0 60px; gap: 14px; }
  .strip i { flex: 1; height: 70px; background-size: cover; background-position: center; border-radius: 6px; opacity: .35; }
  .strip i.on { opacity: 1; box-shadow: 0 0 0 3px #fff; }
  .store { display: inline-block; font-family: Zen, sans-serif; font-size: 34px; color: #fff; background: var(--deep); border-radius: 999px; padding: 22px 54px; }
</style></head>
<body>
<div class="grid"></div>

<!-- 0: オープニング -->
<div class="layer" id="L0">
  <div class="tape yellow" style="left: 465px; top: 700px; transform: rotate(-6deg)"></div>
  <div class="cap" id="l0-logo" style="top: 760px"><div class="logo">StudyReel</div></div>
  <div class="cap" id="l0-sub" style="top: 930px"><div class="serif-r tagline" data-t="tagline"></div></div>
  <div class="cap" id="l0-script" style="top: 1030px"><div class="script" style="font-size: 40px">study with me ♡</div></div>
</div>

<!-- 1: 録画 -->
<div class="layer" id="L1">
  <div class="cap" id="l1-cap" style="top: 170px"><div class="no">0 1</div><div class="t serif" data-t="t1"></div><div class="s sans" data-t="s1"></div></div>
  <div class="shot" id="l1-shot"><img data-img="recording.png"><div class="over" id="rec-timer"><i></i><span id="rec-text">00:00</span></div></div>
</div>

<!-- 2: モザイク -->
<div class="layer" id="L2">
  <div class="cap" id="l2-cap" style="top: 170px"><div class="no">0 2</div><div class="t serif" data-t="t2"></div><div class="s sans" data-t="s2"></div></div>
  <div class="polaroid photo-big" id="l2-photo">
    <div class="tape pink"></div>
    <div class="ph" style="background-image: url(assets/photo-home-day.jpg)"></div>
    <div class="mos" id="l2-mos" style="background-image: url(assets/photo-home-day-mosaic.jpg)"></div>
    <div class="cap2">Tue 10/14 · 2h 25m</div>
  </div>
  <div class="shot" id="l2-shot" style="width: 420px; border-radius: 64px"><img data-img="review.png"></div>
</div>

<!-- 3: ギャラリー -->
<div class="layer" id="L3">
  <div class="cap" id="l3-cap" style="top: 170px"><div class="no">0 3</div><div class="t serif" data-t="t3"></div><div class="s sans" data-t="s3"></div></div>
  <div class="shot" id="l3-shot"><img data-img="home15.png"></div>
  <div class="polaroid mini" id="p1" style="left: 20px; top: 560px"><div class="tape"></div><div class="ph" style="background-image: url(assets/photo-library-morning.jpg)"></div><div class="cap2">Mon 10/13</div></div>
  <div class="polaroid mini" id="p2" style="left: 780px; top: 700px"><div class="tape pink"></div><div class="ph" style="background-image: url(assets/photo-home-day.jpg)"></div><div class="cap2">Tue 10/14</div></div>
  <div class="polaroid mini" id="p3" style="left: 40px; top: 1180px"><div class="tape yellow"></div><div class="ph" style="background-image: url(assets/photo-home-night.jpg)"></div><div class="cap2">Wed 10/15</div></div>
  <div class="polaroid mini" id="p4" style="left: 770px; top: 1340px"><div class="tape"></div><div class="ph" style="background-image: url(assets/photo-library-cloudy.jpg)"></div><div class="cap2">Thu 10/16</div></div>
</div>

<!-- 4: 共有 -->
<div class="layer" id="L4">
  <div class="cap" id="l4-cap" style="top: 170px"><div class="no">0 4</div><div class="t serif" data-t="t4"></div><div class="s sans" data-t="s4"></div></div>
  <div class="shot" id="l4-shot"><img data-img="share.png"></div>
  <div class="hash" id="h1" style="left: 60px; top: 720px" data-t="h1"></div>
  <div class="hash" id="h2" style="left: 760px; top: 900px">#studywithme</div>
  <div class="hash" id="h3" style="left: 80px; top: 1500px">#StudyReel</div>
</div>

<!-- 5: Vlog（写真を速いカットで） -->
<div class="layer" id="L5">
  <div class="cut" id="c1" style="background-image: url(assets/photo-library-morning.jpg)"></div>
  <div class="cut" id="c2" style="background-image: url(assets/photo-home-day.jpg)"></div>
  <div class="cut" id="c3" style="background-image: url(assets/photo-home-night.jpg)"></div>
  <div class="cut" id="c4" style="background-image: url(assets/photo-library-cloudy.jpg)"></div>
  <div class="cut-label" id="l5-label"><div class="d" id="l5-d">Mon 10/13</div><div class="m" id="l5-m">2h 25m</div></div>
  <div class="strip" id="l5-strip"></div>
  <div class="cap" id="l5-cap" style="top: 170px; color: #fff"><div class="no" style="color: #fff; opacity: .8">0 5</div><div class="t serif" style="text-shadow: 0 2px 24px rgba(0,0,0,.45)" data-t="t5"></div><div class="s sans" style="color: #fff; opacity: .9" data-t="s5"></div></div>
  <div class="shot" id="l5-shot"><img data-img="vlog.png"></div>
</div>

<!-- 6: エンディング -->
<div class="layer" id="L6">
  <div class="tape" style="left: 465px; top: 680px; transform: rotate(5deg)"></div>
  <div class="cap" id="l6-logo" style="top: 740px"><div class="logo">StudyReel</div></div>
  <div class="cap" id="l6-sub" style="top: 910px"><div class="serif-r tagline" data-t="tagline"></div></div>
  <div class="cap" id="l6-store" style="top: 1040px"><div class="store" data-t="store"></div></div>
  <div class="cap" id="l6-dev" style="top: 1160px"><div class="sans-r" style="font-size: 28px; color: var(--sub)">iPhone / iPad</div></div>
</div>

<script src="pv.js"></script>
<script>
const DUR = 27.5;
const photos = ['assets/photo-library-morning.jpg', 'assets/photo-home-day.jpg', 'assets/photo-home-night.jpg', 'assets/photo-library-cloudy.jpg'];
const COPY = {
  ja: { tagline: '勉強を、記録する。', store: 'App Store で無料', h1: '#勉強垢',
    t1: '机に置いて、<br>始めるだけ。', s1: '雨の音や集中ノイズを流しながら',
    t2: '顔はモザイクで、<br>しっかり隠せる。', s2: 'カット・フィルター・BGMもかんたん',
    t3: '毎日の勉強を、<br>ギャラリーに。', s3: '撮った記録が、日付ごとに並びます',
    t4: '今日の記録を、<br>勉強垢へ。', s4: '今日・今週・教材ごとにまとめて共有',
    t5: '1週間が、<br>1本のVlogに。', s5: '毎日の記録を自動でまとめます' },
  en: { tagline: 'Record your study.', store: 'Free on the App Store', h1: '#studygram',
    t1: 'Set it down.<br>Press start.', s1: 'Study with rain or focus noise',
    t2: 'Hide your face<br>with a mosaic.', s2: 'Trim, filters and music in a tap',
    t3: 'Your study,<br>as a gallery.', s3: 'Every session, sorted by day',
    t4: 'Share today with<br>your study circle.', s4: 'Today, this week, or one book at a time',
    t5: 'A week,<br>in one vlog.', s5: 'Your sessions, stitched together' },
};
window.setup = () => {
  applyLang(COPY);
  const strip = $('l5-strip');
  for (let i = 0; i < 7; i++) { const e = document.createElement('i'); e.style.backgroundImage = `url(${photos[i % 4]})`; strip.appendChild(e); }
  return ready().then(() => DUR);
};

const cap = (el, t, start, end) => set(el, { y: lerp(30, 0, seg(t, start, 0.7)) - lerp(0, 20, seg(t, end - 0.4, 0.4, ease.in)), o: window_(t, start, end, 0.6, 0.4) });

window.seek = (t) => {
  // 0 オープニング 0–3
  set($('L0'), { o: window_(t, 0, 3.0, 0.01, 0.4) });
  set($('l0-logo'), { y: lerp(40, 0, seg(t, 0.2, 0.9)), o: seg(t, 0.2, 0.7) });
  set($('l0-sub'), { y: lerp(24, 0, seg(t, 0.7, 0.8)), o: seg(t, 0.7, 0.6) });
  set($('l0-script'), { o: seg(t, 1.3, 0.6) });

  // 1 録画 3–8
  set($('L1'), { o: window_(t, 3.0, 8.0, 0.3, 0.4) });
  cap($('l1-cap'), t, 3.1, 8.0);
  setShot($('l1-shot'), { y: lerp(520, 236, seg(t, 3.1, 1.0)), r: lerp(-4, 0, seg(t, 3.1, 1.2)), s: lerp(0.96, 1, seg(t, 3.1, 1.2)), o: seg(t, 3.1, 0.5) });
  $('rec-text').textContent = mmss(Math.max(0, t - 3.9) * 1);

  // 2 モザイク 8–12.5
  set($('L2'), { o: window_(t, 8.0, 12.5, 0.3, 0.4) });
  cap($('l2-cap'), t, 8.1, 12.5);
  set($('l2-photo'), { r: -2 + 0, y: lerp(60, 0, seg(t, 8.1, 0.9)), o: seg(t, 8.1, 0.6), s: lerp(1, 1.03, seg(t, 8.1, 4.4, ease.linear)) });
  $('l2-mos').style.opacity = seg(t, 9.4, 0.35);
  setShot($('l2-shot'), { x: lerp(620, 290, seg(t, 10.4, 0.9)), y: 470, r: lerp(10, 6, seg(t, 10.4, 0.9)), o: seg(t, 10.4, 0.5) });

  // 3 ギャラリー 12.5–17
  set($('L3'), { o: window_(t, 12.5, 17.0, 0.3, 0.4) });
  cap($('l3-cap'), t, 12.6, 17.0);
  setShot($('l3-shot'), { y: lerp(330, 236, seg(t, 12.6, 4.4, ease.linear)), s: lerp(0.96, 1, seg(t, 12.6, 1.0)), o: seg(t, 12.6, 0.5) });
  [['p1', 13.0, -7], ['p2', 13.35, 6], ['p3', 13.7, 5], ['p4', 14.05, -6]].forEach(([id, st, rot]) =>
    set($(id), { r: rot, s: lerp(0.6, 1, seg(t, st, 0.6, ease.outBack)), o: seg(t, st, 0.3) }));

  // 4 共有 17–21
  set($('L4'), { o: window_(t, 17.0, 21.0, 0.3, 0.4) });
  cap($('l4-cap'), t, 17.1, 21.0);
  setShot($('l4-shot'), { y: lerp(300, 236, seg(t, 17.1, 1.0)), s: lerp(0.96, 1, seg(t, 17.1, 1.2)), o: seg(t, 17.1, 0.5) });
  [['h1', 17.9, -5], ['h2', 18.2, 4], ['h3', 18.5, -3]].forEach(([id, st, rot]) =>
    set($(id), { r: rot, y: lerp(30, 0, seg(t, st, 0.6)) + Math.sin((t - st) * 2) * 6, s: lerp(0.7, 1, seg(t, st, 0.6, ease.outBack)), o: seg(t, st, 0.3) }));

  // 5 Vlog 21–24.8（0.42秒ごとに写真を切り替え、最後に画面）
  set($('L5'), { o: window_(t, 21.0, 24.8, 0.3, 0.4) });
  const cutStart = 21.0, cutLen = 0.42, cuts = 6;
  const k = Math.min(cuts - 1, Math.max(0, Math.floor((t - cutStart) / cutLen)));
  const order = [0, 1, 2, 3, 0, 2];
  const labels = [['Mon 10/13', '2h 25m'], ['Tue 10/14', '1h 50m'], ['Wed 10/15', '3h 05m'], ['Thu 10/16', '2h 10m'], ['Fri 10/17', '1h 35m'], ['Sat 10/18', '4h 20m']];
  for (let i = 0; i < 4; i++) {
    const el = $('c' + (i + 1));
    const on = order[k] === i && t < 23.6;
    el.style.opacity = on ? 1 : 0;
    el.style.transform = `scale(${1 + ((t - cutStart) % cutLen) / cutLen * 0.04})`;
  }
  $('l5-d').textContent = labels[k][0]; $('l5-m').textContent = labels[k][1];
  set($('l5-label'), { o: t < 23.6 ? 1 : 0 });
  [...$('l5-strip').children].forEach((e, i) => e.classList.toggle('on', i === k));
  set($('l5-strip'), { o: t < 23.6 ? 1 : 0 });
  cap($('l5-cap'), t, 21.1, 23.6);
  setShot($('l5-shot'), { y: 0, s: lerp(0.8, 1, seg(t, 23.4, 0.8)), o: seg(t, 23.4, 0.4) });

  // 6 エンディング 24.8–27.5
  set($('L6'), { o: window_(t, 24.8, DUR + 1, 0.4, 1) });
  set($('l6-logo'), { y: lerp(30, 0, seg(t, 24.9, 0.9)), o: seg(t, 24.9, 0.6) });
  set($('l6-sub'), { y: lerp(20, 0, seg(t, 25.3, 0.8)), o: seg(t, 25.3, 0.6) });
  set($('l6-store'), { s: lerp(0.8, 1, seg(t, 25.7, 0.6, ease.outBack)), o: seg(t, 25.7, 0.3) });
  set($('l6-dev'), { o: seg(t, 26.2, 0.5) });
};
</script>
</body></html>
