<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="pv.css">
<style>
  .shot { width: 640px; }
  .badge { display: inline-block; font-family: Corm, serif; font-size: 34px; letter-spacing: .32em; color: var(--deep); background: var(--soft); border-radius: 999px; padding: 14px 40px 12px 48px; }
  .hl { position: absolute; border: 6px solid var(--deep); border-radius: 30px; box-shadow: 0 0 0 9999px rgba(247, 248, 250, 0); will-change: transform, opacity; }
  .score { position: absolute; font-family: Mincho, serif; font-size: 58px; color: var(--deep); background: #fff; border-radius: 24px; padding: 18px 34px; box-shadow: 0 14px 30px rgba(46,58,70,.14); will-change: transform, opacity; }
  .score small { font-family: Zen, sans-serif; font-size: 26px; color: var(--sub); margin-left: 10px; letter-spacing: .04em; }
  body.en .score small { font-family: ZenR, sans-serif; }
  .stars { position: absolute; left: 0; right: 0; text-align: center; font-size: 92px; letter-spacing: .18em; color: #F1C75B; }
  .stars i { display: inline-block; font-style: normal; will-change: transform, opacity; }
  .store { display: inline-block; font-family: Zen, sans-serif; font-size: 34px; color: #fff; background: var(--deep); border-radius: 999px; padding: 22px 54px; }
</style></head>
<body>
<div class="grid"></div>

<!-- 0: オープニング -->
<div class="layer" id="L0">
  <div class="cap" id="l0-badge" style="top: 640px"><div class="badge">UPDATE 1.7</div></div>
  <div class="cap" id="l0-logo" style="top: 760px"><div class="logo">StudyReel</div></div>
  <div class="cap" id="l0-sub" style="top: 930px"><div class="serif-r tagline" style="font-size: 46px" data-t="lead"></div></div>
</div>

<!-- 1: 満点が最初から入っている → 点数を入れる -->
<div class="layer" id="L1">
  <div class="cap" id="l1-cap" style="top: 150px"><div class="no">0 1</div><div class="t serif" data-t="t1"></div><div class="s sans" data-t="s1"></div></div>
  <!-- 寄ったときに見出しへかぶらないよう、見出しより下だけに出す -->
  <div style="position: absolute; inset: 0; -webkit-mask-image: linear-gradient(transparent 500px, #000 600px); mask-image: linear-gradient(transparent 500px, #000 600px)">
    <div class="shot" id="l1-a" style="transform-origin: 50% 62%"><img data-img="score-prefilled.png"></div>
    <div class="shot" id="l1-b" style="transform-origin: 50% 62%"><img data-img="score-entered.png"></div>
  </div>
</div>

<!-- 2: ホームの最高点に反映 -->
<div class="layer" id="L2">
  <div class="cap" id="l2-cap" style="top: 150px"><div class="no">0 2</div><div class="t serif" data-t="t2"></div><div class="s sans" data-t="s2"></div></div>
  <div class="shot" id="l2-shot" style="transform-origin: 50% 24%"><img data-img="home-score.png"></div>
  <div class="score" id="l2-pill" style="left: 640px; top: 760px">820<small data-t="best"></small></div>
</div>

<!-- 3: 設定からレビュー -->
<div class="layer" id="L3">
  <div class="cap" id="l3-cap" style="top: 150px"><div class="no">0 3</div><div class="t serif" data-t="t3"></div><div class="s sans" data-t="s3"></div></div>
  <div class="shot" id="l3-shot" style="transform-origin: 50% 80%"><img data-img="settings-review.png"></div>
  <div class="stars" id="stars" style="top: 1660px"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div>
</div>

<!-- 4: エンディング -->
<div class="layer" id="L4">
  <div class="tape pink" style="left: 465px; top: 680px; transform: rotate(5deg)"></div>
  <div class="cap" id="l4-logo" style="top: 740px"><div class="logo">StudyReel</div></div>
  <div class="cap" id="l4-sub" style="top: 910px"><div class="serif-r tagline" data-t="tagline"></div></div>
  <div class="cap" id="l4-store" style="top: 1040px"><div class="store" data-t="store"></div></div>
  <div class="cap" id="l4-dev" style="top: 1160px"><div class="sans-r" style="font-size: 28px; color: var(--sub)" data-t="dev"></div></div>
</div>

<script src="pv.js"></script>
<script>
const DUR = 21;
const COPY = {
  ja: { lead: '点数が、ちゃんと残る。', tagline: '勉強を、記録する。', store: 'App Store でアップデート', dev: 'iPhone / iPad · 無料', best: '最高点',
    t1: '満点は、<br>最初から入っています。', s1: '初めての問題は、目標の満点からはじまります',
    t2: '保存したら、<br>ホームの最高点に。', s2: '前に保存した点数も、そのまま反映されます',
    t3: 'よかったら、<br>レビューを。', s3: '設定から StudyReel をレビューできます' },
  en: { lead: 'Every score counts.', tagline: 'Record your study.', store: 'Update on the App Store', dev: 'iPhone / iPad · Free', best: 'best',
    t1: 'Your max score<br>is already there.', s1: "New papers start from your goal's max score",
    t2: 'Save it, and it shows<br>on Home.', s2: 'Scores you saved before count too',
    t3: 'Enjoying StudyReel?<br>Leave a review.', s3: 'Rate StudyReel from Settings' },
};
window.setup = () => { applyLang(COPY); return ready().then(() => DUR); };
const cap = (el, t, start, end) => set(el, { y: lerp(30, 0, seg(t, start, 0.7)) - lerp(0, 20, seg(t, end - 0.4, 0.4, ease.in)), o: window_(t, start, end, 0.6, 0.4) });

window.seek = (t) => {
  // 0 オープニング 0–3
  set($('L0'), { o: window_(t, 0, 3.0, 0.01, 0.4) });
  set($('l0-badge'), { s: lerp(0.7, 1, seg(t, 0.15, 0.6, ease.outBack)), o: seg(t, 0.15, 0.3) });
  set($('l0-logo'), { y: lerp(40, 0, seg(t, 0.5, 0.9)), o: seg(t, 0.5, 0.7) });
  set($('l0-sub'), { y: lerp(24, 0, seg(t, 1.0, 0.8)), o: seg(t, 1.0, 0.6) });

  // 1 満点 3–9：画面が上がってきて点数の欄に寄り、0 / 990 が 820 / 990 に変わる
  set($('L1'), { o: window_(t, 3.0, 9.0, 0.3, 0.4) });
  cap($('l1-cap'), t, 3.1, 9.0);
  const z1 = seg(t, 4.6, 1.6, ease.inOut);
  const base1 = { y: lerp(560, 300, seg(t, 3.1, 1.0)) + lerp(0, 40, z1), s: lerp(0.96, 1, seg(t, 3.1, 1.2)) * lerp(1, 1.45, z1) };
  setShot($('l1-a'), { ...base1, o: seg(t, 3.1, 0.5) });
  setShot($('l1-b'), { ...base1, o: seg(t, 6.6, 0.45) });

  // 2 ホームの最高点 9–14.5
  set($('L2'), { o: window_(t, 9.0, 14.5, 0.3, 0.4) });
  cap($('l2-cap'), t, 9.1, 14.5);
  const z2 = seg(t, 10.4, 1.8, ease.inOut);
  setShot($('l2-shot'), { y: lerp(560, 300, seg(t, 9.1, 1.0)) + lerp(0, 120, z2), s: lerp(0.96, 1, seg(t, 9.1, 1.2)) * lerp(1, 1.45, z2), o: seg(t, 9.1, 0.5) });
  set($('l2-pill'), { r: -4, y: lerp(30, 0, seg(t, 12.0, 0.6)) + Math.sin((t - 12) * 2) * 5, s: lerp(0.6, 1, seg(t, 12.0, 0.6, ease.outBack)), o: seg(t, 12.0, 0.3) });

  // 3 レビュー 14.5–18
  set($('L3'), { o: window_(t, 14.5, 18.0, 0.3, 0.4) });
  cap($('l3-cap'), t, 14.6, 18.0);
  setShot($('l3-shot'), { y: lerp(560, 330, seg(t, 14.6, 1.0)), s: lerp(0.96, 1, seg(t, 14.6, 1.2)), o: seg(t, 14.6, 0.5) });
  [...$('stars').children].forEach((e, i) => set(e, { y: lerp(30, 0, seg(t, 15.6 + i * 0.16, 0.5)), s: lerp(0.4, 1, seg(t, 15.6 + i * 0.16, 0.5, ease.outBack)), o: seg(t, 15.6 + i * 0.16, 0.25) }));

  // 4 エンディング 18–21
  set($('L4'), { o: window_(t, 18.0, DUR + 1, 0.4, 1) });
  set($('l4-logo'), { y: lerp(30, 0, seg(t, 18.1, 0.9)), o: seg(t, 18.1, 0.6) });
  set($('l4-sub'), { y: lerp(20, 0, seg(t, 18.5, 0.8)), o: seg(t, 18.5, 0.6) });
  set($('l4-store'), { s: lerp(0.8, 1, seg(t, 18.9, 0.6, ease.outBack)), o: seg(t, 18.9, 0.3) });
  set($('l4-dev'), { o: seg(t, 19.4, 0.5) });
};
</script>
</body></html>
