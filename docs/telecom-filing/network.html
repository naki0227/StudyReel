<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ネットワーク構成図</title>
<style>
  @page { size: A4 landscape; margin: 14mm; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", "WenQuanYi Zen Hei", sans-serif; color: #111; margin: 0; }
  h1 { font-size: 17pt; margin: 0 0 2mm; }
  .sub { font-size: 9.5pt; margin: 0 0 6mm; color: #333; }
  svg { width: 100%; height: auto; display: block; }
  .notes { font-size: 9pt; line-height: 1.6; margin-top: 4mm; columns: 2; column-gap: 10mm; }
  .notes p { margin: 0 0 2mm; break-inside: avoid; }
  .foot { font-size: 8.5pt; margin-top: 3mm; color: #333; }
</style>
</head>
<body>
<h1>ネットワーク構成図</h1>
<p class="sub">届出者：【氏名】（屋号：Enludus）　／　提供する役務：スマートフォン用アプリケーションにおける利用者間の通信の媒介（自ら電気通信回線設備は設置しない）</p>

<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Hiragino Sans, Noto Sans JP, WenQuanYi Zen Hei, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- 利用者A -->
  <rect x="20" y="130" width="170" height="150" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="105" y="165" text-anchor="middle" font-size="17" font-weight="700">利用者A</text>
  <text x="105" y="190" text-anchor="middle" font-size="13">スマートフォン</text>
  <text x="105" y="210" text-anchor="middle" font-size="13">（iPhone / iPad）</text>
  <text x="105" y="240" text-anchor="middle" font-size="13">本アプリ</text>
  <text x="105" y="260" text-anchor="middle" font-size="11" fill="#333">（届出者が提供）</text>

  <!-- 利用者B -->
  <rect x="810" y="130" width="170" height="150" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="895" y="165" text-anchor="middle" font-size="17" font-weight="700">利用者B</text>
  <text x="895" y="190" text-anchor="middle" font-size="13">（グループの仲間）</text>
  <text x="895" y="210" text-anchor="middle" font-size="13">スマートフォン</text>
  <text x="895" y="240" text-anchor="middle" font-size="13">本アプリ</text>
  <text x="895" y="260" text-anchor="middle" font-size="11" fill="#333">（届出者が提供）</text>

  <!-- インターネット -->
  <ellipse cx="300" cy="205" rx="70" ry="44" fill="#f4f4f4" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300" y="201" text-anchor="middle" font-size="14">インターネット</text>
  <text x="300" y="220" text-anchor="middle" font-size="10.5" fill="#333">（携帯網・光回線等）</text>
  <ellipse cx="700" cy="205" rx="70" ry="44" fill="#f4f4f4" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="700" y="201" text-anchor="middle" font-size="14">インターネット</text>
  <text x="700" y="220" text-anchor="middle" font-size="10.5" fill="#333">（携帯網・光回線等）</text>

  <!-- クラウド -->
  <rect x="405" y="95" width="190" height="220" rx="14" fill="#eef3ff" stroke="#111" stroke-width="2"/>
  <text x="500" y="125" text-anchor="middle" font-size="15" font-weight="700">クラウドサービス</text>
  <text x="500" y="145" text-anchor="middle" font-size="12">Apple Inc.</text>
  <text x="500" y="162" text-anchor="middle" font-size="12">iCloud（CloudKit）</text>
  <rect x="425" y="178" width="150" height="34" rx="6" fill="#fff" stroke="#555"/>
  <text x="500" y="200" text-anchor="middle" font-size="11.5">グループの共有データ</text>
  <rect x="425" y="220" width="150" height="34" rx="6" fill="#fff" stroke="#555"/>
  <text x="500" y="242" text-anchor="middle" font-size="11.5">参加申請・人数・通報</text>
  <text x="500" y="280" text-anchor="middle" font-size="10.5" fill="#333">他者の設備を利用</text>
  <text x="500" y="296" text-anchor="middle" font-size="10.5" fill="#333">（届出者はサーバーを設置しない）</text>

  <!-- 矢印 -->
  <line x1="192" y1="205" x2="228" y2="205" stroke="#111" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="372" y1="205" x2="403" y2="205" stroke="#111" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="597" y1="205" x2="628" y2="205" stroke="#111" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="772" y1="205" x2="808" y2="205" stroke="#111" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- 通信の内容 -->
  <rect x="20" y="335" width="960" height="78" rx="10" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="40" y="360" font-size="13" font-weight="700">媒介する通信の内容</text>
  <text x="40" y="382" font-size="12">利用者が招待・承認したグループの中で、利用者間で送受信されるデータ：メッセージ（定型の応援スタンプ等・文字）、画像、学習状況（勉強中か、勉強時間など）</text>
  <text x="40" y="401" font-size="12">データは利用者のApple アカウントのiCloudに保存され、届出者は通信の内容を閲覧しない（利用者から通報があった場合に、通報された内容のみ確認する）。</text>

  <text x="500" y="60" text-anchor="middle" font-size="12" fill="#333">利用者A → インターネット → クラウド（CloudKit）に保存 → インターネット → 利用者B が受信（逆方向も同じ）</text>
</svg>

<div class="foot">業務区域：全国　／　届出者が設置する電気通信設備：なし（利用者の端末で動くアプリケーションのみ）　／　利用する他者の設備：Apple Inc. の iCloud（CloudKit）</div>
</body>
</html>
