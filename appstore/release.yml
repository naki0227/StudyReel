review:
  demo_account_required: false
  notes: |
    StudyReel records a time-lapse of the user studying at their desk. No account or sign-in is needed.
    - Camera: used only while a study session is recording. Face detection for the optional mosaic runs on the device.
    - Book lookup: when adding a book, only the ISBN is sent to openBD (api.openbd.jp) and the National Diet Library (ndlsearch.ndl.go.jp) to get the title and cover. Cover text recognition runs on the device.
    - Backup: records are copied to the user's own iCloud Drive (Files app > StudyReel). Nothing is sent to our servers.
    - Pro features are an in-app purchase and can be restored from Settings.
    - Study Buddies (new): small private groups that share only a nickname, a chosen icon, whether someone is studying now, today's/this week's study time and preset stamps. There is no chat. Data is stored with Apple CloudKit in the group owner's iCloud; we run no servers and cannot read group data. It requires an iCloud sign-in.
      - Joining: the owner shows a QR code / link; the person asks to join and the owner approves them after checking a nickname and 4-digit number. Owners can remove members and reset the invite.
      - Safety (Guideline 1.2): nicknames and group names pass a word filter; any member can be blocked (long-press a member) or reported. Reports, with the photo if any, reach the developer, who reviews them within 24 hours and can bar the sender from sharing photos. Contact: contact@enludus.com.
      - Photos are off by default per group. When the owner turns them on, a member can share one frame they pick from their own time-lapse, with faces pixelated; photos disappear after 24 hours. Frames flagged by Apple's Sensitive Content Analysis are not sent or shown. Photos start off for users under 18 (Declared Age Range).
      - To try it with one device: Home > "勉強仲間と一緒にがんばる" > set a nickname > "グループを作る", then tap the QR icon. Joining needs a second iCloud account.
    To try it: tap + on the home screen, choose a timer, then press the round shutter button. Press it again to finish and see the review screen.

