name: Build

# 署名なしでシミュレータ向けにビルドしてコンパイルエラーを見つける。どの変更でも走る。
# PR と main への push で走る（作業ブランチへの push でも走らせると PR と二重になるので外した）
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          # App Store Connect は iOS 26 SDK（Xcode 26 以降）でビルドしたものしか受け付けない
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then echo "::error::Xcode 26 が見つかりません"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build app and widget
        run: |
          set -o pipefail
          xcodebuild \
            -project StudyTimerAndVideo.xcodeproj \
            -scheme StudyTimerAndVideo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
