name: App preview

# App Store のプレビュー動画の素材を撮る。デモ表示のアプリを UI テスト（PreviewTests）で操作し、
# シミュレータの画面を日本語と英語で録画して成果物に残す。仕上げは tools/appstore/preview.py
# Actions の画面から手動で動かすか、コミットメッセージに [preview] を入れて push する
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview]')
    concurrency:
      group: preview-${{ github.ref }}-${{ matrix.lang }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lang: [ja, en]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then echo "::error::Xcode 26 が見つかりません"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Boot simulator
        id: sim
        timeout-minutes: 14
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          wanted = ["iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16"]
          found = {}
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  found.setdefault(d["name"], d["udid"])
          for name in wanted:
              if name in found:
                  print(found[name]); break
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          for attempt in 1 2; do
            xcrun simctl boot "$udid" || true
            if perl -e "alarm 300; exec @ARGV" xcrun simctl bootstatus "$udid" -b; then break; fi
            echo "boot timed out, retrying"
            xcrun simctl shutdown "$udid" || true
          done
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$udid" appearance light

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StudyTimerAndVideo.xcodeproj \
            -scheme StudyTimerAndVideo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20

      - name: Record
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "raw-${{ matrix.lang }}.mp4" &
          recorder=$!
          sleep 3
          TEST_RUNNER_PREVIEW_LANG=${{ matrix.lang }} xcodebuild test-without-building \
            -project StudyTimerAndVideo.xcodeproj \
            -scheme StudyTimerAndVideo \
            -destination "id=$udid" \
            -derivedDataPath build \
            -only-testing:StudyTimerAndVideoUITests/PreviewTests \
            -resultBundlePath Preview.xcresult 2>&1 | tail -40 || true
          sleep 2
          kill -INT $recorder
          wait $recorder || true
          ls -la raw-*.mp4

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-raw-${{ matrix.lang }}
          path: raw-${{ matrix.lang }}.mp4
          if-no-files-found: warn
