name: Review screenshot

# 課金アイテムの審査用スクリーンショットを撮る。
# StudyReelReview.storekit の商品を読み込ませた課金画面をテストの中で描き、
# appstore/purchases/ に置くための PNG を成果物として残す。
# Actions の画面から手動で動かすか、コミットメッセージに [review-shot] を入れて push する
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

concurrency:
  group: review-shot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[review-shot]')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then echo "::error::Xcode 26 が見つかりません"; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Boot simulator
        id: sim
        timeout-minutes: 14
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          wanted = ["iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16"]
          found = {}
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  found.setdefault(d["name"], d["udid"])
          for name in wanted:
              if name in found:
                  print(found[name]); break
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # 起動が固まるランナーがあるので、時間を区切って1回だけやり直す
          for attempt in 1 2; do
            xcrun simctl boot "$udid" || true
            if perl -e "alarm 300; exec @ARGV" xcrun simctl bootstatus "$udid" -b; then break; fi
            echo "boot timed out, retrying"
            xcrun simctl shutdown "$udid" || true
          done
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$udid" appearance light

      - name: Take screenshot
        run: |
          set -o pipefail
          xcodebuild test \
            -project StudyTimerAndVideo.xcodeproj \
            -scheme StudyReelReview \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:StudyTimerAndVideoTests/ReviewScreenshotTests \
            -resultBundlePath Review.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -40 && status=0 || status=$?
          # 失敗しても、そのときの画面を見られるようにスクリーンショットは取り出す
          mkdir -p shots
          xcrun xcresulttool export attachments --path Review.xcresult --output-path shots
          ls -la shots
          exit $status

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshot
          path: shots
          if-no-files-found: warn
