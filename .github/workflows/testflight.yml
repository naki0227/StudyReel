name: TestFlight

# Actions の画面から「Run workflow」を押すと、アーカイブして App Store Connect（TestFlight）に送る。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   ASC_KEY_ID      App Store Connect API キーの Key ID
#   ASC_ISSUER_ID   同じ画面の Issuer ID
#   ASC_KEY_P8      ダウンロードした AuthKey_XXXX.p8 の中身（テキストをそのまま貼る）
# キーは「Admin」権限で作る（署名用の証明書とプロファイルを自動で作るため）
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号（空ならプロジェクトの CURRENT_PROJECT_VERSION）"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Prepare API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 の Secrets を登録してください"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Decide build number
        id: build
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            number="${{ inputs.build_number }}"
          else
            number=$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' StudyTimerAndVideo.xcodeproj/project.pbxproj | grep -o '[0-9]*$')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Build number: $number"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project StudyTimerAndVideo.xcodeproj \
            -scheme StudyTimerAndVideo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StudyReel.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>X97ZJZ42VZ</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StudyReel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          echo "### TestFlight に送りました（ビルド ${{ steps.build.outputs.number }}）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
